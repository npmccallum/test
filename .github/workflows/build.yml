name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install mkosi and dependencies
      run: |
        # mkosi should already be available on GitHub Actions runners
        # If not, install it via pip
        pip3 install --user mkosi

    - name: Build UKI with mkosi
      run: |
        mkosi build --force
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: test.efi
        retention-days: 30
